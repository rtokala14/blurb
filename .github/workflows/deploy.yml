name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Federated credentials — no client secret is stored in the repository.
  id-token: write

jobs:
  image:
    name: Build and push to ACR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_NAME }}:latest
          # Keeps `bun install` and the Vite build out of the critical path on
          # deploys that only change application code.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply migrations
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # DATABASE_URL is an environment secret, in the ADO.NET form copied from
      # the Azure portal:
      #   Server=tcp:srv.database.windows.net,1433;Initial Catalog=db;
      #   User ID=user;Password=...;Encrypt=True
      #
      # The runner needs to reach Azure SQL, so either allow the GitHub ranges
      # on the server firewall or run this job on a self-hosted runner inside
      # the network. Write migrations expand-then-contract so the currently
      # deployed image keeps working while this runs.
      - name: Migrate
        env:
          DB_DRIVER: mssql
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate
