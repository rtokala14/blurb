name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run check:no-zod

  migrations:
    name: Migrations apply to a clean database
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci_Password_1
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Password_1 -No -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    env:
      SA_PASSWORD: Ci_Password_1
      DB_DRIVER: mssql
      DATABASE_URL: 'Server=tcp:localhost,1433;Initial Catalog=app;User ID=sa;Password=Ci_Password_1;Encrypt=True;TrustServerCertificate=True'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The server image ships with system databases only.
      - name: Create database
        run: |
          docker run --rm --network host mcr.microsoft.com/mssql/server:2022-latest \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -No \
            -Q "IF DB_ID('app') IS NULL CREATE DATABASE [app]"

      - name: Apply migrations
        run: bun run db:migrate

      # Catches a migration that is not idempotent or a missing entry in the
      # migration index.
      - name: Re-run to prove it is a no-op
        run: bun run db:migrate

      - name: Show status
        run: bun run src/server/db/migrate.ts status
