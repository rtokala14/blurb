# Local SQL Server for development. Production runs against Azure SQL, which is
# the same engine — migrations and queries written here transfer as-is.
#
#   docker compose -f docker-compose.dev.yml up -d
#   bun run db:migrate
#
# On Apple Silicon, swap the image for mcr.microsoft.com/azure-sql-edge:latest.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_Dev_Password1}
      MSSQL_PID: Developer
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-shot: SQL Server boots with system databases only.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_Dev_Password1}
      APP_DB: ${DB_NAME:-app}
    entrypoint:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -No
        -Q "IF DB_ID('$$APP_DB') IS NULL CREATE DATABASE [$$APP_DB]"

volumes:
  mssql-data:
