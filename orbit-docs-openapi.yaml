        required: true
        schema:
          type: string
      - name: preview
        in: query
        description: |
          A boolean flag that, when set to true, enables the use of beta features in preview mode.
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operations.AsyncOperation"
      security:
      - BearerAuth: []
      x-releaseStage: PRIVATE_BETA
components:
  schemas:
    Core.Distance:
      required:
      - unit
      - value
      type: object
      properties:
        unit:
          $ref: "#/components/schemas/Core.DistanceUnit"
        value:
          type: number
          format: double
          example: 10.0
      description: A measurement of distance.
    Core.DistanceUnit:
      type: string
      enum:
      - MILLIMETERS
      - CENTIMETERS
      - METERS
      - KILOMETERS
      - INCHES
      - FEET
      - YARDS
      - MILES
      - NAUTICAL_MILES
    Core.MediaReference:
      required:
      - mimeType
      - reference
      type: object
      properties:
        mimeType:
          type: string
        reference:
          $ref: "#/components/schemas/Core.Reference"
      description: The representation of a media reference.
    Core.MediaSetViewItem:
      required:
      - mediaItemRid
      - mediaSetRid
      - mediaSetViewRid
      type: object
      properties:
        mediaItemRid:
          type: string
        mediaSetRid:
          type: string
        mediaSetViewRid:
          type: string
        token:
          type: string
    Core.MediaSetViewItemWrapper:
      required:
      - mediaSetViewItem
      - type
      type: object
      properties:
        mediaSetViewItem:
          $ref: "#/components/schemas/Core.MediaSetViewItem"
        type:
          type: string
    Core.Reference:
      description: |
        A union of the types supported by media reference properties.
      discriminator:
        propertyName: type
        mapping:
          mediaSetViewItem: "#/components/schemas/Core.MediaSetViewItemWrapper"
      oneOf:
      - $ref: "#/components/schemas/Core.MediaSetViewItemWrapper"
    Geo.BBox:
      type: array
      description: |
        A GeoJSON object MAY have a member named "bbox" to include
        information on the coordinate range for its Geometries, Features, or
        FeatureCollections. The value of the bbox member MUST be an array of
        length 2*n where n is the number of dimensions represented in the
        contained geometries, with all axes of the most southwesterly point
        followed by all axes of the more northeasterly point. The axes order
        of a bbox follows the axes order of geometries.
      items:
        type: number
        format: double
    Geo.GeoPoint:
      required:
      - coordinates
      - type
      type: object
      properties:
        bbox:
          $ref: "#/components/schemas/Geo.BBox"
        coordinates:
          $ref: "#/components/schemas/Geo.Position"
        type:
          type: string
    Geo.LinearRing:
      minItems: 4
      type: array
      description: |
        A linear ring is a closed LineString with four or more positions.

        The first and last positions are equivalent, and they MUST contain
        identical values; their representation SHOULD also be identical.

        A linear ring is the boundary of a surface or the boundary of a hole in
        a surface.

        A linear ring MUST follow the right-hand rule with respect to the area
        it bounds, i.e., exterior rings are counterclockwise, and holes are
        clockwise.
      items:
        $ref: "#/components/schemas/Geo.Position"
    Geo.Polygon:
      required:
      - type
      type: object
      properties:
        bbox:
          $ref: "#/components/schemas/Geo.BBox"
        coordinates:
          type: array
          items:
            $ref: "#/components/schemas/Geo.LinearRing"
        type:
          type: string
    Geo.Position:
      maxItems: 3
      minItems: 2
      type: array
      description: |
        GeoJSon fundamental geometry construct.

        A position is an array of numbers. There MUST be two or more elements.
        The first two elements are longitude and latitude, precisely in that order and using decimal numbers.
        Altitude or elevation MAY be included as an optional third element.

        Implementations SHOULD NOT extend positions beyond three elements
        because the semantics of extra elements are unspecified and ambiguous.
        Historically, some implementations have used a fourth element to carry
        a linear referencing measure (sometimes denoted as "M") or a numerical
        timestamp, but in most situations a parser will not be able to properly
        interpret these values. The interpretation and meaning of additional
        elements is beyond the scope of this specification, and additional
        elements MAY be ignored by parsers.
      items:
        type: number
        format: double
    Ontologies.ActionResults:
      discriminator:
        propertyName: type
        mapping:
          edits: "#/components/schemas/Ontologies.ObjectEdits"
          largeScaleEdits: "#/components/schemas/Ontologies.ObjectTypeEdits"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.ObjectEdits"
      - $ref: "#/components/schemas/Ontologies.ObjectTypeEdits"
    Ontologies.AddLink:
      required:
      - aSideObject
      - bSideObject
      - linkTypeApiNameAtoB
      - linkTypeApiNameBtoA
      - type
      type: object
      properties:
        aSideObject:
          $ref: "#/components/schemas/Ontologies.LinkSideObject"
        bSideObject:
          $ref: "#/components/schemas/Ontologies.LinkSideObject"
        linkTypeApiNameAtoB:
          type: string
        linkTypeApiNameBtoA:
          type: string
        type:
          type: string
    Ontologies.AddObject:
      required:
      - objectType
      - primaryKey
      - type
      type: object
      properties:
        objectType:
          type: string
        primaryKey: {}
        type:
          type: string
    Ontologies.AggregateObjectsRequestV2:
      type: object
      properties:
        accuracy:
          $ref: "#/components/schemas/Ontologies.AggregationAccuracyRequest"
        aggregation:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.AggregationV2"
        groupBy:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.AggregationGroupByV2"
        where:
          $ref: "#/components/schemas/Ontologies.SearchJsonQueryV2"
    Ontologies.AggregateObjectsResponseItemV2:
      type: object
      properties:
        group:
          type: object
          additionalProperties: {}
          nullable: true
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.AggregationMetricResultV2"
    Ontologies.AggregateObjectsResponseV2:
      required:
      - accuracy
      type: object
      properties:
        accuracy:
          $ref: "#/components/schemas/Ontologies.AggregationAccuracy"
        computeUsage:
          type: number
          format: double
        data:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.AggregateObjectsResponseItemV2"
        excludedItems:
          type: integer
    Ontologies.AggregationAccuracy:
      type: string
      enum:
      - ACCURATE
      - APPROXIMATE
    Ontologies.AggregationAccuracyRequest:
      type: string
      description: |
        Specifies the accuracy requirement for aggregation results.

        - `REQUIRE_ACCURATE`: Only return results if they are guaranteed to be accurate. If accuracy cannot be
          guaranteed (e.g., due to a low `maxGroupCount` relative to distinct values), the request will fail
          with an `AggregationAccuracyNotSupported` error.
        - `ALLOW_APPROXIMATE`: Allow approximate results when exact computation is not feasible. This is the
          default behavior if not specified.
      enum:
      - REQUIRE_ACCURATE
      - ALLOW_APPROXIMATE
    Ontologies.AggregationDurationGroupingV2:
      required:
      - type
      - unit
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        unit:
          $ref: "#/components/schemas/Ontologies.TimeUnit"
        value:
          type: integer
      description: |
        Divides objects into groups according to an interval. Note that this grouping applies only on date and timestamp types.
        When grouping by `YEARS`, `QUARTERS`, `MONTHS`, or `WEEKS`, the `value` must be set to `1`.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.AggregationExactGroupingV2:
      required:
      - type
      type: object
      properties:
        defaultValue:
          type: string
          description: |
            Includes a group with the specified default value that includes all objects where the specified field's value is null.
            Cannot be used with includeNullValues.
        field:
          type: string
        includeNullValues:
          type: boolean
          description: |
            Includes a group with a null value that includes all objects where the specified field's value is null.
            Cannot be used with defaultValue or orderBy clauses on the aggregation.
        maxGroupCount:
          type: integer
          description: |
            The maximum number of groups to return. If omitted, defaults to 10,000.

            The server allocates resources based on the specified `maxGroupCount`. When the number of distinct
            values in your data is within this limit, results are accurate and the top N values are returned
            correctly. When distinct values exceed what the allocated resources can handle, results may become
            approximate.

            If you need accurate results with high-cardinality properties, set `maxGroupCount` high enough to
            cover your distinct values. Items exceeding the limit are excluded from results and counted in
            `excludedItems`. The response `accuracy` field indicates whether the results are `ACCURATE` or
            `APPROXIMATE`.
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Divides objects into groups according to an exact value.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.AggregationFixedWidthGroupingV2:
      required:
      - fixedWidth
      - type
      type: object
      properties:
        field:
          type: string
        fixedWidth:
          type: integer
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Divides objects into groups with the specified width.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.AggregationGroupByV2:
      description: Specifies a grouping for aggregation results.
      discriminator:
        propertyName: type
        mapping:
          duration: "#/components/schemas/Ontologies.AggregationDurationGroupingV2"
          exact: "#/components/schemas/Ontologies.AggregationExactGroupingV2"
          fixedWidth: "#/components/schemas/Ontologies.AggregationFixedWidthGroupingV2"
          ranges: "#/components/schemas/Ontologies.AggregationRangesGroupingV2"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.AggregationDurationGroupingV2"
      - $ref: "#/components/schemas/Ontologies.AggregationFixedWidthGroupingV2"
      - $ref: "#/components/schemas/Ontologies.AggregationRangesGroupingV2"
      - $ref: "#/components/schemas/Ontologies.AggregationExactGroupingV2"
    Ontologies.AggregationMetricResultV2:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        value:
          description: |
            The value of the metric. This will be a double in the case of
            a numeric metric, or a date string in the case of a date metric.
    Ontologies.AggregationRangeV2:
      required:
      - endValue
      - startValue
      type: object
      properties:
        endValue:
          description: Exclusive end.
        startValue:
          description: Inclusive start.
      description: Specifies a range from an inclusive start value to an exclusive
        end value.
    Ontologies.AggregationRangesGroupingV2:
      required:
      - type
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.AggregationRangeV2"
        type:
          type: string
      description: |
        Divides objects into groups according to specified ranges.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.AggregationV2:
      description: Specifies an aggregation function.
      discriminator:
        propertyName: type
        mapping:
          approximateDistinct: "#/components/schemas/Ontologies.ApproximateDistinctAggregationV2"
          approximatePercentile: "#/components/schemas/Ontologies.ApproximatePercentileAggregationV2"
          avg: "#/components/schemas/Ontologies.AvgAggregationV2"
          count: "#/components/schemas/Ontologies.CountAggregationV2"
          exactDistinct: "#/components/schemas/Ontologies.ExactDistinctAggregationV2"
          max: "#/components/schemas/Ontologies.MaxAggregationV2"
          min: "#/components/schemas/Ontologies.MinAggregationV2"
          sum: "#/components/schemas/Ontologies.SumAggregationV2"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.ApproximateDistinctAggregationV2"
      - $ref: "#/components/schemas/Ontologies.MinAggregationV2"
      - $ref: "#/components/schemas/Ontologies.AvgAggregationV2"
      - $ref: "#/components/schemas/Ontologies.MaxAggregationV2"
      - $ref: "#/components/schemas/Ontologies.ApproximatePercentileAggregationV2"
      - $ref: "#/components/schemas/Ontologies.CountAggregationV2"
      - $ref: "#/components/schemas/Ontologies.SumAggregationV2"
      - $ref: "#/components/schemas/Ontologies.ExactDistinctAggregationV2"
    Ontologies.AllOfRule:
      required:
      - ordered
      - type
      type: object
      properties:
        maxGaps:
          type: integer
          description: |
            The maximum gaps between the intervals produced by the sub-rules. If not set, then gaps are not considered.
        ordered:
          type: boolean
          description: "If true, the matched intervals must occur in order."
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.IntervalQueryRule"
        type:
          type: string
      description: |
        Matches intervals satisfying all the rules in the query
    Ontologies.AndQueryV2:
      required:
      - type
      type: object
      properties:
        type:
          type: string
        value:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.SearchJsonQueryV2"
      description: Returns objects where every query is satisfied.
    Ontologies.AnyOfRule:
      required:
      - type
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.IntervalQueryRule"
        type:
          type: string
      description: |
        Matches intervals satisfying any of the rules in the query
    Ontologies.ApplyActionMode:
      type: string
      description: "If not specified, defaults to `VALIDATE_AND_EXECUTE`."
      enum:
      - VALIDATE_ONLY
      - VALIDATE_AND_EXECUTE
    Ontologies.ApplyActionRequestOptions:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/Ontologies.ApplyActionMode"
        returnEdits:
          $ref: "#/components/schemas/Ontologies.ReturnEditsMode"
    Ontologies.ApplyReducersAndExtractMainValueLoadLevel:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: Performs both apply reducers and extract main value to return the
        reduced main value.
    Ontologies.ApplyReducersLoadLevel:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: Returns a single value of an array as configured in the ontology.
    Ontologies.ApproximateDistinctAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes an approximate number of distinct values for the provided field.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ApproximatePercentileAggregationV2:
      required:
      - approximatePercentile
      - type
      type: object
      properties:
        approximatePercentile:
          type: number
          format: double
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes the approximate percentile value for the provided field. Requires Object Storage V2.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ArrayEntryEvaluatedConstraint:
      description: Evaluated constraints for entries of array parameters for which
        per-entry evaluation is supported.
      discriminator:
        propertyName: type
        mapping:
          struct: "#/components/schemas/Ontologies.StructEvaluatedConstraint"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.StructEvaluatedConstraint"
    Ontologies.ArrayEvaluatedConstraint:
      required:
      - type
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.ArrayEntryEvaluatedConstraint"
        type:
          type: string
      description: Evaluated constraints of array parameters that support per-entry
        constraint evaluations.
    Ontologies.ArraySizeConstraint:
      required:
      - type
      type: object
      properties:
        gt:
          description: Greater than
        gte:
          description: Greater than or equal
        lt:
          description: Less than
        lte:
          description: Less than or equal
        type:
          type: string
      description: |
        The parameter expects an array of values and the size of the array must fall within the defined range.
    Ontologies.AsyncActionOperation:
      required:
      - id
      - type
      properties:
        expiryTime:
          type: string
          format: date-time
        id:
          type: string
        result:
          discriminator:
            propertyName: type
            mapping:
              error: "#/components/schemas/Operations.AsyncOperationError"
              success: "#/components/schemas/Ontologies.AsyncApplyActionResponse"
          oneOf:
          - $ref: "#/components/schemas/Ontologies.AsyncApplyActionResponse"
          - $ref: "#/components/schemas/Operations.AsyncOperationError"
        stage:
          $ref: "#/components/schemas/Ontologies.AsyncActionStatus"
        status:
          $ref: "#/components/schemas/Operations.AsyncOperationStatus"
        type:
          type: string
    Ontologies.AsyncActionStatus:
      type: string
      enum:
      - RUNNING_SUBMISSION_CHECKS
      - EXECUTING_WRITE_BACK_WEBHOOK
      - COMPUTING_ONTOLOGY_EDITS
      - COMPUTING_FUNCTION
      - WRITING_ONTOLOGY_EDITS
      - EXECUTING_SIDE_EFFECT_WEBHOOK
      - SENDING_NOTIFICATIONS
    Ontologies.AsyncApplyActionOperationResponseV2:
      required:
      - type
      type: object
      properties:
        type:
          type: string
    Ontologies.AsyncApplyActionOperationV2:
      required:
      - id
      - type
      properties:
        expiryTime:
          type: string
          format: date-time
        id:
          type: string
        result:
          discriminator:
            propertyName: type
            mapping:
              error: "#/components/schemas/Operations.AsyncOperationError"
              success: "#/components/schemas/Ontologies.AsyncApplyActionOperationResponseV2"
          oneOf:
          - $ref: "#/components/schemas/Ontologies.AsyncApplyActionOperationResponseV2"
          - $ref: "#/components/schemas/Operations.AsyncOperationError"
        stage:
          $ref: "#/components/schemas/Ontologies.AsyncActionStatus"
        status:
          $ref: "#/components/schemas/Operations.AsyncOperationStatus"
        type:
          type: string
    Ontologies.AsyncApplyActionResponse:
      required:
      - type
      type: object
      properties:
        type:
          type: string
    Ontologies.AsyncApplyActionResponseV2:
      required:
      - operationId
      type: object
      properties:
        operationId:
          type: string
    Ontologies.AvgAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes the average value for the provided field.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.BatchActionObjectEdit:
      discriminator:
        propertyName: type
        mapping:
          addLink: "#/components/schemas/Ontologies.AddLink"
          addObject: "#/components/schemas/Ontologies.AddObject"
          modifyObject: "#/components/schemas/Ontologies.ModifyObject"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.ModifyObject"
      - $ref: "#/components/schemas/Ontologies.AddObject"
      - $ref: "#/components/schemas/Ontologies.AddLink"
    Ontologies.BatchActionObjectEdits:
      required:
      - addedLinksCount
      - addedObjectCount
      - deletedLinksCount
      - deletedObjectsCount
      - modifiedObjectsCount
      - type
      type: object
      properties:
        addedLinksCount:
          type: integer
        addedObjectCount:
          type: integer
        deletedLinksCount:
          type: integer
        deletedObjectsCount:
          type: integer
        edits:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.BatchActionObjectEdit"
        modifiedObjectsCount:
          type: integer
        type:
          type: string
    Ontologies.BatchActionResults:
      discriminator:
        propertyName: type
        mapping:
          edits: "#/components/schemas/Ontologies.BatchActionObjectEdits"
          largeScaleEdits: "#/components/schemas/Ontologies.ObjectTypeEdits"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.BatchActionObjectEdits"
      - $ref: "#/components/schemas/Ontologies.ObjectTypeEdits"
    Ontologies.BatchApplyActionResponseV2:
      type: object
      properties:
        edits:
          $ref: "#/components/schemas/Ontologies.BatchActionResults"
    Ontologies.BoundingBoxValue:
      required:
      - bottomRight
      - topLeft
      - type
      type: object
      properties:
        bottomRight:
          $ref: "#/components/schemas/Ontologies.WithinBoundingBoxPoint"
        topLeft:
          $ref: "#/components/schemas/Ontologies.WithinBoundingBoxPoint"
        type:
          type: string
      description: |
        The top left and bottom right coordinate points that make up the bounding box.
    Ontologies.CenterPoint:
      required:
      - center
      - distance
      type: object
      properties:
        center:
          $ref: "#/components/schemas/Ontologies.CenterPointTypes"
        distance:
          $ref: "#/components/schemas/Core.Distance"
      description: |
        The coordinate point to use as the center of the distance query.
    Ontologies.CenterPointTypes:
      discriminator:
        propertyName: type
        mapping:
          Point: "#/components/schemas/Geo.GeoPoint"
      oneOf:
      - $ref: "#/components/schemas/Geo.GeoPoint"
    Ontologies.ContainsAllTermsInOrderPrefixLastTerm:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: string
          example: foo bar
      description: "Returns objects where the specified field contains all of the\
        \ terms in the order provided, \nbut they do have to be adjacent to each other.\n\
        The last term can be a partial prefix match. Allows you to specify a property\
        \ to query on\nby a variety of means. Either `field` or `propertyIdentifier`\
        \ can be supplied, but not both.\n"
    Ontologies.ContainsAllTermsInOrderQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: string
          example: foo bar
      description: |
        Returns objects where the specified field contains all of the terms in the order provided,
        but they do have to be adjacent to each other. Allows you to specify a property to query on
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ContainsAllTermsQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        fuzzy:
          type: boolean
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: string
          example: foo bar
      description: |
        Returns objects where the specified field contains all of the whitespace separated words in any
        order in the provided value. This query supports fuzzy matching. Allows you to specify a property to query on
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ContainsAnyTermQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        fuzzy:
          type: boolean
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: string
          example: foo bar
      description: "Returns objects where the specified field contains any of the\
        \ whitespace separated words in any \norder in the provided value. This query\
        \ supports fuzzy matching. Allows you to specify a property to query on\n\
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied,\
        \ but not both.\n"
    Ontologies.ContainsQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: "Returns objects where the specified array contains a value. Allows\
        \ you to specify a property to query on by a \nvariety of means. Either `field`\
        \ or `propertyIdentifier` must be supplied, but not both.\n"
    Ontologies.CountAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        name:
          type: string
        type:
          type: string
      description: Computes the total count of objects.
    Ontologies.CountObjectsResponseV2:
      type: object
      properties:
        count:
          type: integer
    Ontologies.DeleteLink:
      required:
      - aSideObject
      - bSideObject
      - linkTypeApiNameAtoB
      - linkTypeApiNameBtoA
      - type
      type: object
      properties:
        aSideObject:
          $ref: "#/components/schemas/Ontologies.LinkSideObject"
        bSideObject:
          $ref: "#/components/schemas/Ontologies.LinkSideObject"
        linkTypeApiNameAtoB:
          type: string
        linkTypeApiNameBtoA:
          type: string
        type:
          type: string
    Ontologies.DeleteObject:
      required:
      - objectType
      - primaryKey
      - type
      type: object
      properties:
        objectType:
          type: string
        primaryKey: {}
        type:
          type: string
    Ontologies.DoesNotIntersectBoundingBoxQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          $ref: "#/components/schemas/Ontologies.BoundingBoxValue"
      description: "Returns objects where the specified field does not intersect the\
        \ bounding box provided. Allows you to specify a \nproperty to query on by\
        \ a variety of means. Either `field` or `propertyIdentifier` must be supplied,\
        \ but not \nboth.\n"
    Ontologies.DoesNotIntersectPolygonQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          $ref: "#/components/schemas/Ontologies.PolygonValue"
      description: "Returns objects where the specified field does not intersect the\
        \ polygon provided. Allows you to specify a \nproperty to query on by a variety\
        \ of means. Either `field` or `propertyIdentifier` must be supplied, but not\
        \ \nboth.\n"
    Ontologies.EqualsQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: |
        Returns objects where the specified field is equal to a value. Allows you to specify a property to query on
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied, but not both.

        For string properties, full term matching only works when **Selectable** is enabled for the property in Ontology Manager.
    Ontologies.ExactDistinctAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes an exact number of distinct values for the provided field. May be slower than an approximate
        distinct aggregation. Requires Object Storage V2.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ExtractMainValueLoadLevel:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: Returns the main value of a struct as configured in the ontology.
    Ontologies.FuzzyRule:
      required:
      - term
      - type
      type: object
      properties:
        fuzziness:
          type: integer
          description: |
            Maximum edit distance allowed for matching. Valid values are 0, 1, or 2. Defaults to 2.
        term:
          type: string
          description: The term to match.
        type:
          type: string
      description: |
        Matches intervals containing terms that are similar to the provided term, within an edit distance
        defined by fuzziness. An edit is a single character change needed to make a term match, including
        character insertion, deletion, substitution, or transposition of two adjacent characters.
    Ontologies.GeoJsonString:
      required:
      - geoJson
      - type
      type: object
      properties:
        geoJson:
          type: string
          description: |
            A GeoJSON geometry string. Supported geometry types include Point, MultiPoint, LineString,
            MultiLineString, Polygon, MultiPolygon, and GeometryCollection.
        type:
          type: string
      description: A GeoJSON geometry specification.
    Ontologies.GeoShapeV2Geometry:
      description: |
        Geometry specification for a GeoShapeV2Query. Supports bounding box envelopes and arbitrary GeoJSON geometries.
      discriminator:
        propertyName: type
        mapping:
          envelope: "#/components/schemas/Ontologies.BoundingBoxValue"
          geoJson: "#/components/schemas/Ontologies.GeoJsonString"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.BoundingBoxValue"
      - $ref: "#/components/schemas/Ontologies.GeoJsonString"
    Ontologies.GeoShapeV2Query:
      required:
      - geometry
      - spatialFilterMode
      - type
      type: object
      properties:
        field:
          type: string
        geometry:
          $ref: "#/components/schemas/Ontologies.GeoShapeV2Geometry"
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        spatialFilterMode:
          $ref: "#/components/schemas/Ontologies.SpatialFilterMode"
        type:
          type: string
      description: |
        Returns objects where the specified field satisfies the provided geometry query with the given spatial operator.
        Supports both envelope (bounding box) and GeoJSON geometries for filtering geopoint or geoshape properties.
        Either `field` or `propertyIdentifier` can be supplied, but not both.
    Ontologies.GroupMemberConstraint:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: |
        The parameter value must be the user id of a member belonging to at least one of the groups defined by the constraint.
    Ontologies.GtQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: |
        Returns objects where the specified field is greater than a value. Allows you to specify a property to query on
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.GteQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: "Returns objects where the specified field is greater than or equal\
        \ to a value. Allows you to specify a property \nto query on by a variety\
        \ of means. Either `field` or `propertyIdentifier` must be supplied, but not\
        \ both.\n"
    Ontologies.InQuery:
      required:
      - type
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: array
          items: {}
      description: |
        Returns objects where the specified field equals any of the provided values. Allows you to
        specify a property to query on by a variety of means. If an empty array is provided as the value, then the filter will match all objects
        in the object set. Either `field` or `propertyIdentifier` must be supplied, but not both.

        For string properties, full term matching only works when **Selectable** is enabled for the property in Ontology Manager.
    Ontologies.IntersectsBoundingBoxQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          $ref: "#/components/schemas/Ontologies.BoundingBoxValue"
      description: "Returns objects where the specified field intersects the bounding\
        \ box provided. Allows you to specify a property \nto query on by a variety\
        \ of means. Either `field` or `propertyIdentifier` must be supplied, but not\
        \ both.\n"
    Ontologies.IntersectsPolygonQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          $ref: "#/components/schemas/Ontologies.PolygonValue"
      description: "Returns objects where the specified field intersects the polygon\
        \ provided. Allows you to specify a property to \nquery on by a variety of\
        \ means. Either `field` or `propertyIdentifier` must be supplied, but not\
        \ both.\n"
    Ontologies.IntervalQuery:
      required:
      - rule
      - type
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        rule:
          $ref: "#/components/schemas/Ontologies.IntervalQueryRule"
        type:
          type: string
      description: "Returns objects where the specified field matches the sub-rule\
        \ provided. This applies to the analyzed form of \ntext fields. Either `field`\
        \ or `propertyIdentifier` can be supplied, but not both.\n"
    Ontologies.IntervalQueryRule:
      description: Sub-rule used for evaluating an IntervalQuery
      discriminator:
        propertyName: type
        mapping:
          allOf: "#/components/schemas/Ontologies.AllOfRule"
          anyOf: "#/components/schemas/Ontologies.AnyOfRule"
          fuzzy: "#/components/schemas/Ontologies.FuzzyRule"
          match: "#/components/schemas/Ontologies.MatchRule"
          prefixOnLastToken: "#/components/schemas/Ontologies.PrefixOnLastTokenRule"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.AllOfRule"
      - $ref: "#/components/schemas/Ontologies.MatchRule"
      - $ref: "#/components/schemas/Ontologies.AnyOfRule"
      - $ref: "#/components/schemas/Ontologies.PrefixOnLastTokenRule"
      - $ref: "#/components/schemas/Ontologies.FuzzyRule"
    Ontologies.IsNullQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: boolean
          example: false
      description: |
        Returns objects based on the existence of the specified field. Allows you to specify a property to query on
        by a variety of means. Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.LinkSideObject:
      required:
      - objectType
      - primaryKey
      type: object
      properties:
        objectType:
          type: string
        primaryKey: {}
    Ontologies.LtQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: "Returns objects where the specified field is less than a value.\
        \ Allows you to specify a property to query on \nby a variety of means. Either\
        \ `field` or `propertyIdentifier` must be supplied, but not both.\n"
    Ontologies.LteQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value: {}
      description: "Returns objects where the specified field is less than or equal\
        \ to a value. Allows you to specify a property to \nquery on by a variety\
        \ of means. Either `field` or `propertyIdentifier` must be supplied, but not\
        \ both.\n"
    Ontologies.MatchRule:
      required:
      - ordered
      - query
      - type
      type: object
      properties:
        maxGaps:
          type: integer
          description: |
            The maximum gaps between matched terms in the interval. For example, in the text "quick brown fox",
            the terms "quick" and "fox" have a gap of one. If not set, then gaps are not considered.
        ordered:
          type: boolean
          description: "If true, the matched terms must occur in order."
        query:
          type: string
        type:
          type: string
      description: |
        Matches intervals containing the terms in the query
    Ontologies.MaxAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes the maximum value for the provided field.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.MinAggregationV2:
      required:
      - type
      type: object
      properties:
        direction:
          $ref: "#/components/schemas/Ontologies.OrderByDirection"
        field:
          type: string
        name:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        Computes the minimum value for the provided field.
        Either `field` or `propertyIdentifier` must be supplied, but not both.
    Ontologies.ModifyObject:
      required:
      - objectType
      - primaryKey
      - type
      type: object
      properties:
        objectType:
          type: string
        primaryKey: {}
        type:
          type: string
    Ontologies.NotQueryV2:
      required:
      - type
      - value
      type: object
      properties:
        type:
          type: string
        value:
          $ref: "#/components/schemas/Ontologies.SearchJsonQueryV2"
      description: Returns objects where the query is not satisfied.
    Ontologies.ObjectEdit:
      discriminator:
        propertyName: type
        mapping:
          addLink: "#/components/schemas/Ontologies.AddLink"
          addObject: "#/components/schemas/Ontologies.AddObject"
          deleteLink: "#/components/schemas/Ontologies.DeleteLink"
          deleteObject: "#/components/schemas/Ontologies.DeleteObject"
          modifyObject: "#/components/schemas/Ontologies.ModifyObject"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.ModifyObject"
      - $ref: "#/components/schemas/Ontologies.DeleteObject"
      - $ref: "#/components/schemas/Ontologies.AddObject"
      - $ref: "#/components/schemas/Ontologies.DeleteLink"
      - $ref: "#/components/schemas/Ontologies.AddLink"
    Ontologies.ObjectEdits:
      required:
      - addedLinksCount
      - addedObjectCount
      - deletedLinksCount
      - deletedObjectsCount
      - modifiedObjectsCount
      - type
      type: object
      properties:
        addedLinksCount:
          type: integer
        addedObjectCount:
          type: integer
        deletedLinksCount:
          type: integer
        deletedObjectsCount:
          type: integer
        edits:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.ObjectEdit"
        modifiedObjectsCount:
          type: integer
        type:
          type: string
    Ontologies.ObjectPropertyValueConstraint:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: |
        The parameter value must be a property value of an object found within an object set.
    Ontologies.ObjectQueryResultConstraint:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: |
        The parameter value must be the primary key of an object found within an object set.
    Ontologies.ObjectTypeEdits:
      required:
      - type
      type: object
      properties:
        editedObjectTypes:
          type: array
          items:
            type: string
        type:
          type: string
    Ontologies.OneOfConstraint:
      required:
      - otherValuesAllowed
      - type
      type: object
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.ParameterOption"
        otherValuesAllowed:
          type: boolean
          description: "A flag denoting whether custom, user provided values will\
            \ be considered valid. This is configured via the **Allowed \"Other\"\
            \ value** toggle in the **Ontology Manager**."
        type:
          type: string
      description: |
        The parameter has a manually predefined set of options.
    Ontologies.OrQueryV2:
      required:
      - type
      type: object
      properties:
        type:
          type: string
        value:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.SearchJsonQueryV2"
      description: Returns objects where at least 1 query is satisfied.
    Ontologies.OrderByDirection:
      type: string
      enum:
      - ASC
      - DESC
    Ontologies.ParameterEvaluatedConstraint:
      description: "A constraint that an action parameter value must satisfy in order\
        \ to be considered valid.\nConstraints can be configured on action parameters\
        \ in the **Ontology Manager**. \nApplicable constraints are determined dynamically\
        \ based on parameter inputs. \nParameter values are evaluated against the\
        \ final set of constraints.\n\nThe type of the constraint.\n| Type       \
        \           | Description                                                \
        \                                                                        \
        \                                                                        \
        \                     |\n|-----------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
        | `arraySize`           | The parameter expects an array of values and the\
        \ size of the array must fall within the defined range.                  \
        \                                                                        \
        \                                |\n| `groupMember`         | The parameter\
        \ value must be the user id of a member belonging to at least one of the groups\
        \ defined by the constraint.                                             \
        \                                                             |\n| `objectPropertyValue`\
        \ | The parameter value must be a property value of an object found within\
        \ an object set.                                                         \
        \                                                                        \
        \          |\n| `objectQueryResult`   | The parameter value must be the primary\
        \ key of an object found within an object set.                           \
        \                                                                        \
        \                                         |\n| `oneOf`               | The\
        \ parameter has a manually predefined set of options.                    \
        \                                                                        \
        \                                                                        \
        \     |\n| `range`               | The parameter value must be within the\
        \ defined range.                                                         \
        \                                                                        \
        \                                          |\n| `stringLength`        | The\
        \ parameter value must have a length within the defined range.           \
        \                                                                        \
        \                                                                        \
        \     |\n| `stringRegexMatch`    | The parameter value must match a predefined\
        \ regular expression.                                                    \
        \                                                                        \
        \                                     |\n| `unevaluable`         | The parameter\
        \ cannot be evaluated because it depends on another parameter or object set\
        \ that can't be evaluated. This can happen when a parameter's allowed values\
        \ are defined by another parameter that is missing or invalid. |\n"
      discriminator:
        propertyName: type
        mapping:
          array: "#/components/schemas/Ontologies.ArrayEvaluatedConstraint"
          arraySize: "#/components/schemas/Ontologies.ArraySizeConstraint"
          groupMember: "#/components/schemas/Ontologies.GroupMemberConstraint"
          objectPropertyValue: "#/components/schemas/Ontologies.ObjectPropertyValueConstraint"
          objectQueryResult: "#/components/schemas/Ontologies.ObjectQueryResultConstraint"
          oneOf: "#/components/schemas/Ontologies.OneOfConstraint"
          range: "#/components/schemas/Ontologies.RangeConstraint"
          stringLength: "#/components/schemas/Ontologies.StringLengthConstraint"
          stringRegexMatch: "#/components/schemas/Ontologies.StringRegexMatchConstraint"
          struct: "#/components/schemas/Ontologies.StructEvaluatedConstraint"
          unevaluable: "#/components/schemas/Ontologies.UnevaluableConstraint"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.StructEvaluatedConstraint"
      - $ref: "#/components/schemas/Ontologies.OneOfConstraint"
      - $ref: "#/components/schemas/Ontologies.ArrayEvaluatedConstraint"
      - $ref: "#/components/schemas/Ontologies.GroupMemberConstraint"
      - $ref: "#/components/schemas/Ontologies.ObjectPropertyValueConstraint"
      - $ref: "#/components/schemas/Ontologies.RangeConstraint"
      - $ref: "#/components/schemas/Ontologies.ArraySizeConstraint"
      - $ref: "#/components/schemas/Ontologies.ObjectQueryResultConstraint"
      - $ref: "#/components/schemas/Ontologies.StringLengthConstraint"
      - $ref: "#/components/schemas/Ontologies.StringRegexMatchConstraint"
      - $ref: "#/components/schemas/Ontologies.UnevaluableConstraint"
    Ontologies.ParameterEvaluationResult:
      required:
      - required
      - result
      type: object
      properties:
        evaluatedConstraints:
          type: array
          items:
            $ref: "#/components/schemas/Ontologies.ParameterEvaluatedConstraint"
        required:
          type: boolean
          description: Represents whether the parameter is a required input to the
            action.
        result:
          $ref: "#/components/schemas/Ontologies.ValidationResult"
      description: Represents the validity of a parameter against the configured constraints.
    Ontologies.ParameterOption:
      type: object
      properties:
        displayName:
          type: string
        value:
          description: An allowed configured value for a parameter within an action.
      description: |
        A possible value for the parameter. This is defined in the **Ontology Manager** by Actions admins.
    Ontologies.PolygonValue:
      discriminator:
        propertyName: type
        mapping:
          Polygon: "#/components/schemas/Geo.Polygon"
      oneOf:
      - $ref: "#/components/schemas/Geo.Polygon"
    Ontologies.PrefixOnLastTokenRule:
      required:
      - query
      - type
      type: object
      properties:
        query:
          type: string
        type:
          type: string
      description: |
        Matches intervals containing all the terms, using exact match for all but the last term, and prefix match for
        the last term. Ordering of the terms in the query is preserved.
    Ontologies.PrimaryKeyPropertySelector:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: Specifies the primary key property of an object type which is present
        on all object types.
    Ontologies.PropertyApiNameSelector:
      required:
      - apiName
      - type
      type: object
      properties:
        apiName:
          type: string
        type:
          type: string
      description: A property api name that references properties to query on.
    Ontologies.PropertyIdentifier:
      description: An identifier used to select properties or struct fields.
      discriminator:
        propertyName: type
        mapping:
          primaryKeyProperty: "#/components/schemas/Ontologies.PrimaryKeyPropertySelector"
          property: "#/components/schemas/Ontologies.PropertyApiNameSelector"
          propertyWithLoadLevel: "#/components/schemas/Ontologies.PropertyWithLoadLevelSelector"
          structField: "#/components/schemas/Ontologies.StructFieldSelector"
          titleProperty: "#/components/schemas/Ontologies.TitlePropertySelector"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.PropertyApiNameSelector"
      - $ref: "#/components/schemas/Ontologies.StructFieldSelector"
      - $ref: "#/components/schemas/Ontologies.PropertyWithLoadLevelSelector"
      - $ref: "#/components/schemas/Ontologies.TitlePropertySelector"
      - $ref: "#/components/schemas/Ontologies.PrimaryKeyPropertySelector"
    Ontologies.PropertyLoadLevel:
      description: |
        The load level of the property:
        - APPLY_REDUCERS: Returns a single value of an array as configured in the ontology.
        - EXTRACT_MAIN_VALUE: Returns the main value of a struct as configured in the ontology.
        - APPLY_REDUCERS_AND_EXTRACT_MAIN_VALUE: Performs both to return the reduced main value.
      discriminator:
        propertyName: type
        mapping:
          applyReducers: "#/components/schemas/Ontologies.ApplyReducersLoadLevel"
          applyReducersAndExtractMainValue: "#/components/schemas/Ontologies.ApplyReducersAndExtractMainValueLoadLevel"
          extractMainValue: "#/components/schemas/Ontologies.ExtractMainValueLoadLevel"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.ApplyReducersAndExtractMainValueLoadLevel"
      - $ref: "#/components/schemas/Ontologies.ApplyReducersLoadLevel"
      - $ref: "#/components/schemas/Ontologies.ExtractMainValueLoadLevel"
    Ontologies.PropertyWithLoadLevelSelector:
      required:
      - loadLevel
      - propertyIdentifier
      - type
      type: object
      properties:
        loadLevel:
          $ref: "#/components/schemas/Ontologies.PropertyLoadLevel"
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
      description: |
        A combination of a property API name and the load level to apply to the property. You can select a reduced value
        for arrays and the main value for structs. If the provided load level cannot be applied to the property type,
        then it will be ignored. This selector is experimental and may not work in filters or sorts.
    Ontologies.RangeConstraint:
      required:
      - type
      type: object
      properties:
        gt:
          description: Greater than
        gte:
          description: Greater than or equal
        lt:
          description: Less than
        lte:
          description: Less than or equal
        type:
          type: string
      description: |
        The parameter value must be within the defined range.
    Ontologies.ReferenceSigningOptions:
      type: object
      properties:
        signMediaReferences:
          type: boolean
          description: |
            If set to true, the response will include a `token` on each `MediaReference` value that can be used to
            access the referenced media item directly. This enables item-level access control: the caller
            does not need view access on the parent media set, only access to the object whose property holds the
            reference.

            Only applies to media references backed by a media set view. Arrays of media references are
            not signed. Defaults to false if not set.
      description: Options for signing references in the response.
    Ontologies.RegexQuery:
      required:
      - type
      - value
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        type:
          type: string
        value:
          type: string
          example: .*fo?o*
      description: "Returns objects where the specified field matches the regex pattern\
        \ provided. This applies to the non-analyzed\nform of text fields. Supported\
        \ operators:\n  - `.` matches any character.\n  - `?` repeats the previous\
        \ character 0 or 1 times.\n  - `+` repeats the previous character 1 or more\
        \ times.\n  - `*` repeats the previous character 0 or more times.\n  - `{}`\
        \ defines the minimum and maximum number of times the preceding character\
        \ can repeat. `{2}` means the\n    previous character must repeat only twice,\
        \ `{2,}` means the previous character must repeat at least twice,\n    and\
        \ `{2,4}` means the previous character must repeat between 2-4 times.\n  -\
        \ `|` is the OR operator.\n  - `()` forms a group within an expression such\
        \ that the group can be treated as a single character.\n  - `[]` matches a\
        \ single one of the characters contained inside the brackets, meaning [abc]\
        \ matches `a`, `b` or\n    `c`. Unless `-` is the first character or escaped\
        \ with `\\` (in which case it is treated as a normal character),\n    `-`\
        \ can be used inside the bracket to create a range of characters, meaning\
        \ [a-c] matches `a`, `b`, or `c`.\n    If the character sequence inside the\
        \ brackets begins with `^`, the set of characters is negated, meaning\n  \
        \  [^abc] does not match `a`, `b`, or `c`. Otherwise, `^` is treated as a\
        \ normal character.\n  - `\"` creates groups of string literals.\n  - `\\\
        ` is used as an escape character. However, \\d and \\D match digit and non-digit\
        \ characters respectively, \\s \n  and \\S match whitespace and non whitespace\
        \ characters respectively, and \\w and \\W match word and non word \n  characters\
        \ respectively.\n\nEither `field` or `propertyIdentifier` can be supplied,\
        \ but not both.\n"
    Ontologies.RelativeDateRangeBound:
      description: Specifies a bound for a relative date range query.
      discriminator:
        propertyName: type
        mapping:
          relativePoint: "#/components/schemas/Ontologies.RelativePointInTime"
      oneOf:
      - $ref: "#/components/schemas/Ontologies.RelativePointInTime"
    Ontologies.RelativeDateRangeQuery:
      required:
      - timeZoneId
      - type
      type: object
      properties:
        field:
          type: string
        propertyIdentifier:
          $ref: "#/components/schemas/Ontologies.PropertyIdentifier"
        relativeEndTime:
          $ref: "#/components/schemas/Ontologies.RelativeDateRangeBound"
        relativeStartTime:
          $ref: "#/components/schemas/Ontologies.RelativeDateRangeBound"
        timeZoneId:
          type: string
          description: |
            Time zone ID for midnight calculation (e.g., "America/New_York", "Europe/London", "Etc/UTC").
            See https://en.wikipedia.org/wiki/List_of_tz_database_time_zones for valid values.
          example: America/New_York
        type:
          type: string
      description: |
        Returns objects where the specified date or timestamp property falls within a relative date range.
        The bounds are calculated relative to query execution time and rounded to midnight in the specified timezone.

        Examples:
        - Last 7 days: relativeStartTime = {value: -7, timeUnit: DAY}, relativeEndTime = {value: 0, timeUnit: DAY}
        - This month: relativeStartTime = {value: 0, timeUnit: MONTH}, relativeEndTime = {value: 1, timeUnit: MONTH}
    Ontologies.RelativePointInTime:
      required:
      - timeUnit
      - type
      - value
      type: object
      properties:
        timeUnit:
          $ref: "#/components/schemas/Ontologies.RelativeTimeUnit"
        type:
          type: string
        value:
          type: integer
          description: |
            The numeric value of the time offset. Negative values indicate the past, positive values the future.
          example: -7
      description: A point in time specified relative to query execution time.
    Ontologies.RelativeTimeUnit:
      type: string
      description: Units for relative time calculations.
      enum:
      - DAY
      - WEEK
      - MONTH
      - YEAR
    Ontologies.ReturnEditsMode:
      type: string
      description: "If not specified, defaults to `NONE`."
      enum:
      - ALL
      - ALL_V2_WITH_DELETIONS
      - NONE
